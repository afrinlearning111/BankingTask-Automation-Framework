name: BankingTask - Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:     # manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4   # 🔥 update to v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4   # 🔥 updated
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache Maven packages
        uses: actions/cache@v4    # 🔥 updated
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Tests
        run: mvn clean test -X

      # Step 5: Upload TestNG reports
      - name: Upload TestNG Reports
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: target/surefire-reports/
          if-no-files-found: warn

      # Step 6: Upload Extent Reports
      - name: Upload Extent Reports
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReports
          path: extent-reports/
          if-no-files-found: warn
