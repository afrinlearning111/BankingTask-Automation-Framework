name: BankingTask - Maven CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Set WebDriver Path
        run: echo "WEBDRIVER_PATH=$env:ChromeWebDriver\chromedriver.exe" >> $env:GITHUB_ENV

      - name: Run Tests
        run: mvn test -Dwebdriver.chrome.driver="$env:WEBDRIVER_PATH" -Dtestng.dtd.http=true

      - name: Upload TestNG Reports
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Extent Reports
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReports
          path: extent-reports/
          if-no-files-found: warn
