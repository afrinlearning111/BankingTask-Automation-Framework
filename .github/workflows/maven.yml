name: BankingTask - Maven CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:     # manual trigger

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Set ChromeDriver path
        run: echo "CHROMEWEBDRIVER=$env:ChromeWebDriver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Tests
        run: mvn -B test -Dtestng.dtd.http=true -Dwebdriver.chrome.driver=$env:ChromeWebDriver\chromedriver.exe


      # Step 5: Upload TestNG reports
      - name: Upload TestNG Reports
        uses: actions/upload-artifact@v4
        with:
          name: TestNG-Reports
          path: target/surefire-reports/
          if-no-files-found: warn

      # Step 6: Upload Extent Reports
      - name: Upload Extent Reports
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReports
          path: extent-reports/
          if-no-files-found: warn
